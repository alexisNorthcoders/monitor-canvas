<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Monitor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css"
        integrity="sha384-IfV0B7MIOYuO95kO9G5ySKPz/85zqFNOAs8iy4tkK5zd9izhJAB8b7lHrwYqqmYE" crossorigin="anonymous">
    <style>
        :root {
            color-scheme: light;
            --page: #f9f9f7;
            --surface: #fcfcfb;
            --surface-2: #f3f2ee;
            --ink: #0b0b0b;
            --ink-2: #52514e;
            --muted: #898781;
            --grid: #e1e0d9;
            --axis: #c3c2b7;
            --border: rgba(11, 11, 11, 0.10);
            --series-1: #2a78d6;
            --series-2: #eb6834;
            --good: #0ca30c;
            --warning: #fab219;
            --serious: #ec835a;
            --critical: #d03b3b;
            --idle: #898781;
            --radius: 10px;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --page: #0d0d0d;
                --surface: #1a1a19;
                --surface-2: #232321;
                --ink: #ffffff;
                --ink-2: #c3c2b7;
                --grid: #2c2c2a;
                --axis: #383835;
                --border: rgba(255, 255, 255, 0.10);
                --series-1: #3987e5;
                --series-2: #d95926;
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --page: #0d0d0d;
            --surface: #1a1a19;
            --surface-2: #232321;
            --ink: #ffffff;
            --ink-2: #c3c2b7;
            --grid: #2c2c2a;
            --axis: #383835;
            --border: rgba(255, 255, 255, 0.10);
            --series-1: #3987e5;
            --series-2: #d95926;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--page);
            color: var(--ink);
            font-size: 14px;
            line-height: 1.4;
        }

        .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }

        header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
        }
        header h1 { font-size: 20px; font-weight: 600; }
        .host { color: var(--ink-2); font-size: 13px; }
        .host span + span::before { content: "·"; margin: 0 6px; color: var(--muted); }

        .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
        .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
        .conn.live .dot { background: var(--good); }
        .conn.lost .dot { background: var(--critical); }

        button, .seg button {
            font: inherit; color: var(--ink); background: var(--surface);
            border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer;
        }
        button:hover { background: var(--surface-2); }
        button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }

        .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
        .seg { display: inline-flex; max-width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
        .seg button { flex: none; border: 0; border-radius: 0; padding: 6px 12px; background: transparent; color: var(--ink-2); }
        .seg button + button { border-left: 1px solid var(--border); }
        .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
        .toolbar .note { color: var(--muted); font-size: 12px; }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px 16px;
        }
        .card h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
        .card h2 small { font-weight: 400; color: var(--muted); }

        /* Stat tiles */
        .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .tile .label { font-size: 12px; color: var(--ink-2); }
        .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
        .tile .value small { font-size: 14px; font-weight: 400; color: var(--ink-2); margin-left: 2px; }
        .tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; min-height: 17px; }
        .meter { height: 4px; border-radius: 2px; background: var(--grid); margin-top: 8px; overflow: hidden; }
        .meter i { display: block; height: 100%; border-radius: 2px; background: var(--series-1); width: 0; transition: width .4s; }
        .meter i.warn { background: var(--warning); }
        .meter i.crit { background: var(--critical); }

        /* Charts */
        .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .chart { min-height: 220px; position: relative; transition: opacity .2s; }
        .chart.loading { opacity: .5; }
        .chart .plot { width: 100%; }
        .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin: -2px 0 6px; }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
        .legend i.band { height: 8px; opacity: .25; }
        .empty { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }

        .u-legend { display: none; }
        .uplot { font-family: inherit; }

        .tip {
            position: absolute; pointer-events: none; z-index: 5; display: none;
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, .12); white-space: nowrap;
        }
        .tip .t { color: var(--muted); margin-bottom: 2px; }
        .tip .row { display: flex; align-items: center; gap: 8px; }
        .tip .row i { width: 10px; height: 2px; display: inline-block; }
        .tip .row b { font-variant-numeric: tabular-nums; }
        .tip .row span { color: var(--ink-2); }

        /* Services */
        .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 16px; }
        @media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }

        .summary { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
        .group { margin-top: 12px; }
        .group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        td, th { padding: 6px 6px; text-align: left; border-top: 1px solid var(--grid); vertical-align: middle; }
        th { font-weight: 500; color: var(--muted); font-size: 12px; border-top: 0; }
        td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
        td.name { font-weight: 500; overflow-wrap: anywhere; }
        td.detail { color: var(--ink-2); overflow-wrap: anywhere; }

        .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
        .status svg { width: 14px; height: 14px; flex: none; }
        .status.up { color: var(--ink-2); }
        .status.up svg { color: var(--good); }
        .status.warn svg { color: var(--warning); }
        .status.down { color: var(--critical); font-weight: 600; }
        .status.down svg { color: var(--critical); }
        .status.stopped { color: var(--muted); }
        .status.stopped svg { color: var(--idle); }

        .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
        .stats b { color: var(--ink); font-weight: 500; }

        .ports { display: flex; flex-wrap: wrap; gap: 6px; }
        .ports span { font-size: 12px; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }

        .events { list-style: none; max-height: 340px; overflow: auto; }
        .events li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 7px 0; border-top: 1px solid var(--grid); font-size: 13px; }
        .events li:first-child { border-top: 0; }
        .events .when { color: var(--muted); font-size: 12px; grid-column: 2; }

        .tier { margin-bottom: 12px; }
        .tier .top { display: flex; justify-content: space-between; font-size: 13px; }
        .tier .top span:last-child { color: var(--ink-2); font-variant-numeric: tabular-nums; }
        .tier .sub { font-size: 12px; color: var(--muted); }
        .bigsize { font-size: 26px; font-weight: 600; }
        .bigsize small { font-size: 13px; color: var(--ink-2); font-weight: 400; }

        details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; margin-top: 8px; }

        /* Logs panel */
        button.linkish { background: none; border: 0; padding: 0; font: inherit; font-weight: 500; color: inherit; text-align: left; overflow-wrap: anywhere; }
        button.linkish:hover { background: none; color: var(--series-1); text-decoration: underline; }
        dialog#logs {
            color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 0; margin: auto; width: min(1100px, 92vw); height: min(780px, 88vh); overflow: hidden;
        }
        dialog#logs[open] { display: flex; flex-direction: column; }
        dialog#logs::backdrop { background: rgba(0, 0, 0, .5); }
        .logs-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--border); }
        .logs-head h2 { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
        .logs-head .group { margin: 0; color: var(--muted); font-size: 12px; }
        .logs-head .spacer { flex: 1; }
        .logs-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
        .logs-bar [role="tablist"] { display: inline-flex; gap: 4px; }
        .logs-bar [role="tab"] { background: transparent; border-color: transparent; color: var(--ink-2); }
        .logs-bar [role="tab"][aria-selected="true"] { background: var(--surface); border-color: var(--border); color: var(--ink); font-weight: 600; }
        .logs-bar .count { margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--series-1); color: #fff; font-size: 11px; font-variant-numeric: tabular-nums; }
        .logs-bar .count[hidden] { display: none; }
        .logs-bar label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
        .logs-bar .spacer { flex: 1; }
        .logs-body { position: relative; flex: 1; min-height: 0; display: flex; }
        .logs-pane {
            flex: 1; min-width: 0; overflow: auto; padding: 8px 14px; background: var(--page);
            font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        .logs-pane[hidden] { display: none; }
        .logs-pane .line { white-space: pre-wrap; overflow-wrap: anywhere; }
        dialog#logs.nowrap .logs-pane .line { white-space: pre; overflow-wrap: normal; }
        #logsNote { position: absolute; left: 14px; top: 10px; right: 14px; color: var(--muted); font-size: 13px; pointer-events: none; }
        #logsNote[hidden] { display: none; }
        #logsJump { position: absolute; right: 18px; bottom: 14px; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
        #logsJump[hidden] { display: none; }
        @media (max-width: 600px) {
            dialog#logs { width: 100vw; height: 100dvh; max-width: none; max-height: none; border-radius: 0; border: 0; }
        }
        @media (max-width: 600px) {
            .charts { grid-template-columns: 1fr; }
            .hide-sm { display: none; }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div>
                <h1>Pi Monitor</h1>
                <div class="host" id="host"></div>
            </div>
            <div style="display:flex;gap:12px;align-items:center">
                <span class="conn" id="conn"><span class="dot"></span><span id="connText">Connecting…</span></span>
                <button id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
            </div>
        </header>

        <div class="toolbar">
            <div class="seg" id="ranges" role="group" aria-label="Time range">
                <button data-range="15m">15m</button>
                <button data-range="1h">1h</button>
                <button data-range="6h">6h</button>
                <button data-range="24h">24h</button>
                <button data-range="7d">7d</button>
                <button data-range="30d">30d</button>
                <button data-range="1y">1y</button>
                <button data-range="2y">2y</button>
            </div>
            <span class="note" id="tierNote"></span>
        </div>

        <section class="tiles" id="tiles" aria-label="Current readings"></section>

        <section class="charts" id="charts"></section>

        <div class="grid2">
            <section class="card">
                <h2>Services</h2>
                <div class="summary" id="svcSummary"></div>
                <div id="services"></div>
            </section>
            <div style="display:grid;gap:12px;align-content:start">
                <section class="card">
                    <h2>Recent status changes</h2>
                    <ul class="events" id="events"></ul>
                </section>
                <section class="card">
                    <h2>Metrics storage</h2>
                    <div id="storage"></div>
                </section>
                <section class="card">
                    <h2>Listening ports <small>(all interfaces)</small></h2>
                    <div class="ports" id="ports"></div>
                </section>
            </div>
        </div>
    </div>

    <dialog id="logs" aria-labelledby="logsName">
        <div class="logs-head">
            <span id="logsStatus"></span>
            <h2 id="logsName"></h2>
            <span class="group" id="logsGroup"></span>
            <span class="spacer"></span>
            <span class="conn" id="logsConn"><span class="dot"></span><span id="logsConnText">Connecting…</span></span>
            <button type="button" id="logsClose" aria-label="Close logs">✕</button>
        </div>
        <div class="logs-bar">
            <div role="tablist" aria-label="Log stream">
                <button type="button" role="tab" id="logsTab-out" aria-controls="logsPane-out" aria-selected="true">Output</button>
                <button type="button" role="tab" id="logsTab-err" aria-controls="logsPane-err" aria-selected="false" tabindex="-1">Errors<span class="count" hidden></span></button>
            </div>
            <span class="spacer"></span>
            <label><input type="checkbox" id="logsWrap"> Wrap lines</label>
            <button type="button" id="logsClear">Clear</button>
        </div>
        <div class="logs-body">
            <div class="logs-pane" id="logsPane-out" role="tabpanel" aria-labelledby="logsTab-out" tabindex="0"></div>
            <div class="logs-pane" id="logsPane-err" role="tabpanel" aria-labelledby="logsTab-err" tabindex="0" hidden></div>
            <p id="logsNote" hidden></p>
            <button type="button" id="logsJump" hidden>Jump to latest ↓</button>
        </div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"
        integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>

</html>
